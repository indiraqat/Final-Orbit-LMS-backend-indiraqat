services:
  - type: web
    name: orbit-lms-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-lms-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: orbit-lms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*" # tighten this to your deployed frontend's URL once you have one

databases:
  - name: orbit-lms-db
    plan: free
